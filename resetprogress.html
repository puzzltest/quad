

<script src="https://cdn.jsdelivr.net/npm/zipson@latest/dist/zipson.min.js"></script>
<script type="module">
  import lzstring from 'https://cdn.jsdelivr.net/npm/lz-string@1.5.0/+esm';
  (function() {
    localStorage.setItem("save_new", lzstring.compressToUTF16(JSON.stringify({
      player: {
        d: 1,
        dx: 1,
        dy: 0,
        x: 0,
        y: 0,
        z: -1,
      },
      panels: {},
      signs: {},
      stars: [],
    })));
    setTimeout(() => window.location.href = "/?map=new", 100);
  })();
</script>
